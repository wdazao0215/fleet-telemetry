name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecución anterior: en un repo con PRs frecuentes,
# gastar minutos en validar un commit ya superado no aporta señal.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cachear paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar
        run: dotnet restore backend/FleetTelemetry.sln

      - name: Compilar
        run: dotnet build backend/FleetTelemetry.sln --configuration Release --no-restore

      # Los tests de integración levantan contenedores con Testcontainers y se ejecutan aparte:
      # así un fallo de infraestructura del runner no se confunde con un fallo de lógica.
      - name: Tests unitarios y de arquitectura
        run: |
          dotnet test backend/FleetTelemetry.sln \
            --configuration Release --no-build \
            --filter "FullyQualifiedName!~Integration" \
            --logger "trx;LogFileName=unit.trx" \
            --results-directory artifacts/tests

      # Se ejecutan aparte y con más tiempo: levantan Redis y TimescaleDB reales con
      # Testcontainers. Separarlos mantiene el diagnóstico limpio -- un fallo aquí es de integración
      # o del runner, nunca de lógica de dominio.
      - name: Tests de integración (Testcontainers)
        run: |
          dotnet test backend/tests/FleetTelemetry.Integration.Tests \
            --configuration Release --no-build \
            --logger "trx;LogFileName=integration.trx" \
            --results-directory artifacts/tests
        timeout-minutes: 15

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-backend
          path: artifacts/tests
          if-no-files-found: ignore

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Compilar
        run: npm run build

  terraform:
    name: Infraestructura (Terraform)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.1"

      - name: Comprobar formato
        run: terraform fmt -check -recursive

      # -backend=false: valida sin necesitar credenciales ni el bucket de estado remoto.
      - name: Inicializar
        run: terraform init -backend=false

      - name: Validar
        run: terraform validate -no-color

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        service:
          - { path: src/Services/FleetTelemetry.Ingestion.Api,     assembly: FleetTelemetry.Ingestion.Api }
          - { path: src/Services/FleetTelemetry.Query.Api,         assembly: FleetTelemetry.Query.Api }
          - { path: src/Services/FleetTelemetry.Processing.Worker, assembly: FleetTelemetry.Processing.Worker }
          - { path: src/Services/FleetTelemetry.Migrator,           assembly: FleetTelemetry.Migrator }
          - { path: src/Tools/FleetTelemetry.Simulator,             assembly: FleetTelemetry.Simulator }
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Construir ${{ matrix.service.assembly }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          build-args: |
            PROJECT_PATH=${{ matrix.service.path }}
            ASSEMBLY_NAME=${{ matrix.service.assembly }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
