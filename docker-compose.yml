# Entorno completo con un solo comando: docker compose up --build
#
# Todas las variables llevan valor por defecto de desarrollo, de modo que 'docker compose up'
# funciona en un clon recién hecho sin copiar ningún .env primero. El .env sigue existiendo para
# sobrescribirlas cuando hace falta.
#
# Los servicios de aplicación no arrancan hasta que la infraestructura reporta healthy. Sin esa
# condición, el primer arranque es una carrera: la API intenta conectar a Postgres antes de que
# acepte conexiones y muere en bucle, que es el fallo más común de un compose recién clonado.

name: fleet-telemetry

x-dotnet-build: &dotnet-build
  context: .
  dockerfile: backend/Dockerfile

services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fleet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fleet_telemetry}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet} -d ${POSTGRES_DB:-fleet_telemetry}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-fleet_local_dev}", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fleet_local_dev}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fleet}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fleet_local_dev}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  ingestion-api:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/FleetTelemetry.Ingestion.Api
        ASSEMBLY_NAME: FleetTelemetry.Ingestion.Api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:-fleet_local_dev}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-fleet}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-fleet_local_dev}
      Ingestion__ApiKey: ${INGESTION_API_KEY:-dev-fleet-key}
      Telemetry__DeduplicationWindowSeconds: ${TELEMETRY_DEDUPE_WINDOW_SECONDS:-10}
      Telemetry__StoppedRadiusMeters: ${TELEMETRY_STOPPED_RADIUS_METERS:-10}
      Telemetry__StoppedThresholdSeconds: ${TELEMETRY_STOPPED_THRESHOLD_SECONDS:-60}
    ports:
      - "8081:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  query-api:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/FleetTelemetry.Query.Api
        ASSEMBLY_NAME: FleetTelemetry.Query.Api
    ports:
      - "8082:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  processing-worker:
    build:
      <<: *dotnet-build
      args:
        PROJECT_PATH: src/Services/FleetTelemetry.Processing.Worker
        ASSEMBLY_NAME: FleetTelemetry.Processing.Worker
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  timescale-data:
